<section id="new-user" class="panel" aria-labelledby="new-h" {% if oob %}hx-swap-oob="true"{% endif %}>
    <div class="panel-head"><h2 id="new-h">Add a team member</h2></div>
    <form class="panel-body stack-s" hx-post="/dashboard/users" hx-target="#users-wrap" hx-swap="innerHTML">
      <div class="field"><label for="n-name">Full name</label><input id="n-name" name="full_name" required maxlength="100" autocomplete="off"></div>
      <div class="field"><label for="n-email">Email</label><input id="n-email" name="email" type="email" required autocomplete="off"></div>
      <div class="field"><label for="n-pass">Temporary password</label><input id="n-pass" name="password" type="password" required minlength="8" maxlength="64" autocomplete="new-password">
        <p class="hint">At least 8 characters. Ask them to keep it private.</p></div>
      <div class="field"><label for="n-role">Role</label><select id="n-role" name="role"><option value="agent">Agent</option><option value="admin">Admin</option><option value="customer">Customer</option></select></div>
      <button class="btn btn-primary" type="submit">Create account</button>
    </form>
  </section>
